name: GIA
channels:
  - conda-forge   # 호환성 확보를 위해 추가
  - pytorch
  - nvidia
  - defaults
dependencies:
  # 핵심 패키지 및 버전만 명시합니다. Conda가 Windows에 맞는 종속성을 처리합니다.
  - python=3.11
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - torchaudio=2.4.1
  - torchvision=0.19.1
  - numpy
  - pandas
  - jupyter
  - mkl=2023.1.0 # MKL 라이브러리를 명시적으로 유지하여 성능 확보

  # pip 영역은 그대로 유지합니다.
